services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb -p local/${MINIO_BUCKET_DATASETS} || true;
      mc mb -p local/${MINIO_BUCKET_RESULTS} || true;
      mc mb -p local/${MINIO_BUCKET_EXPORTS} || true;
      mc ilm rule add --expire-days ${EXPORT_RETENTION_DAYS} local/${MINIO_BUCKET_RESULTS} || true;
      mc ilm rule add --expire-days ${EXPORT_RETENTION_DAYS} local/${MINIO_BUCKET_EXPORTS} || true;
      exit 0;
      "

  sso-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${SSO_POSTGRES_DB}
      POSTGRES_USER: ${SSO_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SSO_POSTGRES_PASSWORD}
    volumes:
      - sso_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SSO_POSTGRES_USER} -d ${SSO_POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  sso-redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes --requirepass ${SSO_REDIS_PASSWORD}
    environment:
      SSO_REDIS_PASSWORD: ${SSO_REDIS_PASSWORD}
    volumes:
      - sso_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${SSO_REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  sso-mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${SSO_MAILPIT_UI_PORT}:8025"

  sso-migrator:
    build:
      context: ./sso
      dockerfile: ./tools/migrator/dockerfile
    environment:
      DB_HOST: sso-postgres
      DB_PORT: 5432
      DB_USER: ${SSO_POSTGRES_USER}
      DB_PASSWORD: ${SSO_POSTGRES_PASSWORD}
      DB_NAME: ${SSO_POSTGRES_DB}
    depends_on:
      sso-postgres:
        condition: service_healthy

  sso-core:
    build:
      context: ./sso
      dockerfile: ./dockerfile
    environment:
      DOMAIN: ${SSO_DOMAIN}
      PUBLIC_URL: ${SSO_PUBLIC_URL}
      FRONTEND_URL: ${SSO_FRONTEND_URL}
      ALLOWED_REDIRECT_URLS: ${SSO_ALLOWED_REDIRECT_URLS}
      ALLOWED_CORS_ORIGINS: ${SSO_ALLOWED_CORS_ORIGINS}
      DEFAULT_ADMIN_EMAILS: ${SSO_DEFAULT_ADMIN_EMAILS}
      DB_HOST: sso-postgres
      DB_PORT: 5432
      DB_USER: ${SSO_POSTGRES_USER}
      DB_PASSWORD: ${SSO_POSTGRES_PASSWORD}
      DB_NAME: ${SSO_POSTGRES_DB}
      DB_SSL: disable
      REDIS_HOST: sso-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${SSO_REDIS_PASSWORD}
      REDIS_DB: 0
      SMTP_HOST: sso-mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      FROM_EMAIL: ${SSO_FROM_EMAIL}
      SMTP_JWT_SECRET: ${SSO_SMTP_JWT_SECRET}
      JWT_SECRET_KEY: ${SSO_JWT_SECRET}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      COOKIE_PATH: /
      COOKIE_SECURE: "false"
      COOKIE_HTTP_ONLY: "true"
      COOKIE_SAME_SITE: Lax
      COOKIE_MAX_AGE: 7d
      HTTP_PORT: 8080
      GRPC_PORT: 50051
      GRPC_TIMEOUT: 24h
      SWAGGER_ENABLED: "true"
      GOOGLE_CLIENT_ID: ${SSO_GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${SSO_GOOGLE_CLIENT_SECRET}
      YANDEX_CLIENT_ID: ${SSO_YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET: ${SSO_YANDEX_CLIENT_SECRET}
    depends_on:
      sso-postgres:
        condition: service_healthy
      sso-redis:
        condition: service_healthy
      sso-mailpit:
        condition: service_started
      sso-migrator:
        condition: service_completed_successfully

  backend:
    build:
      context: ./backend
    command: /bin/sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --ws-ping-interval 20 --ws-ping-timeout 120"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE}
      MINIO_BUCKET_DATASETS: ${MINIO_BUCKET_DATASETS}
      MINIO_BUCKET_RESULTS: ${MINIO_BUCKET_RESULTS}
      MINIO_BUCKET_EXPORTS: ${MINIO_BUCKET_EXPORTS}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES}
      ALLOWED_CORS_ORIGINS: ${ALLOWED_CORS_ORIGINS}
      STUCK_JOB_TIMEOUT_MINUTES: ${STUCK_JOB_TIMEOUT_MINUTES}
      MC_PARALLEL_ENABLED: ${MC_PARALLEL_ENABLED}
      MC_MAX_PROCESSES: ${MC_MAX_PROCESSES}
      MC_BATCH_SIZE: ${MC_BATCH_SIZE}
      WS_HEARTBEAT_SECONDS: ${WS_HEARTBEAT_SECONDS}
      DIM_MODE: ${DIM_MODE}
      SIMULATION_VERSION: ${SIMULATION_VERSION}
      SSO_JWT_SECRET: ${SSO_JWT_SECRET}
      SSO_JWT_ALGORITHMS: ${SSO_JWT_ALGORITHMS}
      SSO_USER_ID_CLAIM: ${SSO_USER_ID_CLAIM}
    ports:
      - "${BACKEND_PORT}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  backend-worker:
    build:
      context: ./backend
    command: /bin/sh -c "python -m app.worker"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: ${MINIO_SECURE}
      MINIO_BUCKET_DATASETS: ${MINIO_BUCKET_DATASETS}
      MINIO_BUCKET_RESULTS: ${MINIO_BUCKET_RESULTS}
      MINIO_BUCKET_EXPORTS: ${MINIO_BUCKET_EXPORTS}
      STUCK_JOB_TIMEOUT_MINUTES: ${STUCK_JOB_TIMEOUT_MINUTES}
      MC_PARALLEL_ENABLED: ${MC_PARALLEL_ENABLED}
      MC_MAX_PROCESSES: ${MC_MAX_PROCESSES}
      MC_BATCH_SIZE: ${MC_BATCH_SIZE}
      WS_HEARTBEAT_SECONDS: ${WS_HEARTBEAT_SECONDS}
      DIM_MODE: ${DIM_MODE}
      SIMULATION_VERSION: ${SIMULATION_VERSION}
      SSO_JWT_SECRET: ${SSO_JWT_SECRET}
      SSO_JWT_ALGORITHMS: ${SSO_JWT_ALGORITHMS}
      SSO_USER_ID_CLAIM: ${SSO_USER_ID_CLAIM}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_SSO_API_BASE_URL: ${VITE_SSO_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
      - sso-core

volumes:
  postgres_data:
  minio_data:
  sso_postgres_data:
  sso_redis_data:
